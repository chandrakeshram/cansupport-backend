# ====================================================================================================
# application-render.properties
# Properties specific to the 'render' profile (for deployment on Render).
# These properties are designed to pick up values from Render's Environment Variables.
# ====================================================================================================

# Database Connection for Render Deployment
# Spring Boot automatically maps environment variables like SPRING_DATASOURCE_URL
# to spring.datasource.url property.
# The actual values for these will be provided as Environment Variables on Render's dashboard.
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA/Hibernate properties for deployment
# Set ddl-auto to 'none' or 'validate' in production and manage schema with Flyway/Liquibase.
# 'update' is acceptable for simple hobby apps on deployment if you're comfortable.
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update} # Default to update if env var not set
spring.jpa.show-sql=${SPRING_JPA_SHOW_SQL:false} # Default to false for less verbose logs in deployment
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.defer-datasource-initialization=true

# Logging Level for Deployed App
logging.level.org.springframework.security=INFO # Less verbose logs for deployed environment
logging.level.org.hibernate.SQL=INFO

# Mail configuration can remain the same or be overridden by env vars if needed
# spring.mail.host=${SPRING_MAIL_HOST:sandbox.smtp.mailtrap.io}
# ... etc.